[env:esp32dev]
platform  = espressif32@6.12.0
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.partitions = default.csv   ; or "min_spiffs.csv" for OTA

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.2